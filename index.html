<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임 마켓 순위 & 신작 모니터링 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <header class="flex flex-col md:flex-row md:items-center justify-between pb-4 border-b border-slate-800 gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          <i class="fa-solid fa-chart-line text-indigo-400"></i> Market Intelligence Dashboard
        </h1>
        <p class="text-sm text-slate-400">구글 스프레드시트 실시간 데이터 연동</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="syncStatus" class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-3 py-1.5 rounded-full flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 실시간 연동 준비
        </span>
        <button onclick="fetchAllData()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
          <i class="fa-solid fa-rotate"></i> 새로고침
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-5 shadow-sm">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">구글플레이 최고 매출 1위</div>
        <div id="kpiTopGrossing" class="text-xl font-bold text-white mt-2">로딩 중...</div>
        <div class="text-xs text-indigo-400 mt-1 flex items-center gap-1"><i class="fa-solid fa-crown"></i> Google Play Top Grossing</div>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-5 shadow-sm">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">구글플레이 인기 1위</div>
        <div id="kpiTopFree" class="text-xl font-bold text-white mt-2">로딩 중...</div>
        <div class="text-xs text-emerald-400 mt-1 flex items-center gap-1"><i class="fa-solid fa-fire"></i> Google Play Top Free</div>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-5 shadow-sm">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">추적 중인 타이틀 수 (매출 기준)</div>
        <div id="kpiTrackedCount" class="text-2xl font-bold text-white mt-2">-</div>
        <div class="text-xs text-slate-400 mt-1">고유 앱 개수</div>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-5 shadow-sm">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">추적 중인 타이틀 수 (인기 기준)</div>
        <div id="kpiNewReleaseCount" class="text-2xl font-bold text-white mt-2">-</div>
        <div class="text-xs text-amber-400 mt-1">고유 앱 개수</div>
      </div>
    </div>

    <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-6 shadow-sm">
      <div class="flex flex-col md:flex-row md:items-center justify-between pb-4 gap-4">
        <div>
          <h2 class="text-lg font-semibold text-white">타이틀별 매출 순위 변동 추이</h2>
          <p class="text-xs text-slate-400">기본값: 최신 일자 기준 Top 5 타이틀 표시</p>
        </div>
        <div class="flex items-center gap-2">
          <input type="text" id="chartFilterInput" placeholder="비교할 게임명 입력 (쉼표 구분)" 
                 class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500 w-64">
          <button onclick="updateChartFilter()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-xs font-medium">적용</button>
        </div>
      </div>
      <div class="h-80 w-full">
        <canvas id="rankChart"></canvas>
      </div>
    </div>

    <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl shadow-sm overflow-hidden">
      <div class="flex border-b border-slate-700/60 bg-slate-800/40 px-6 pt-3 gap-6">
        <button onclick="switchTab('sales')" id="tabBtn-sales" class="pb-3 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400">
          매출 순위 DB
        </button>
        <button onclick="switchTab('popular')" id="tabBtn-popular" class="pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200">
          인기 순위 DB
        </button>
        <button onclick="switchTab('newReleases')" id="tabBtn-newReleases" class="pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200">
          월간 신작 DB
        </button>
      </div>
      <div class="p-4 border-b border-slate-700/40 flex justify-between items-center gap-4">
        <div class="relative w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
          <input type="text" id="tableSearch" onkeyup="filterCurrentTable()" placeholder="게임명, 장르 또는 퍼블리셔 검색..." 
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div id="tableRowCount" class="text-xs text-slate-400">데이터 수집 중...</div>
      </div>
      <div class="overflow-x-auto max-h-96">
        <table class="w-full text-left border-collapse text-xs">
          <thead id="tableHead" class="bg-slate-900/80 sticky top-0 border-b border-slate-700 text-slate-300"></thead>
          <tbody id="tableBody" class="divide-y divide-slate-800/60 text-slate-300"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = '1CW7Xr3eWBUKBPC0DXRDsqqrx2itUlzZfXPVF2hUoMAw';
    let rawStore = { sales: null, popular: null, newReleases: null };
    let currentTab = 'sales';
    let chartInstance = null;

    async function fetchSheetData(sheetName) {
      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
      const res = await fetch(url);
      const text = await res.text();
      const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
      const json = JSON.parse(jsonString);
      
      const cols = json.table.cols.map(c => c ? c.label : '');
      const rows = json.table.rows.map(r => r.c.map(cell => cell ? (cell.f || cell.v) : ''));
      return { cols, rows };
    }

    async function fetchAllData() {
      const statusEl = document.getElementById('syncStatus');
      statusEl.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> 데이터 동기화 중...';
      
      try {
        const [salesData, popularData, newReleaseData] = await Promise.all([
          fetchSheetData('DB_매출순위'),
          fetchSheetData('DB_인기순위'),
          fetchSheetData('월간신작DB')
        ]);

        rawStore.sales = salesData;
        rawStore.popular = popularData;
        rawStore.newReleases = newReleaseData;

        renderKPIs();
        renderChart();
        renderTable();

        statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> 정상 동기화 완료';
      } catch (err) {
        console.error(err);
        statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span> 동기화 실패';
      }
    }

    function renderKPIs() {
      // 순위 컬럼(인덱스 1)이 '1'인 행을 찾아 앱이름(인덱스 3) 추출
      const topGrossingRow = rawStore.sales.rows.find(r => Number(r[1]) === 1);
      document.getElementById('kpiTopGrossing').textContent = topGrossingRow ? topGrossingRow[3] : '-';

      const topFreeRow = rawStore.popular.rows.find(r => Number(r[1]) === 1);
      document.getElementById('kpiTopFree').textContent = topFreeRow ? topFreeRow[3] : '-';

      // 중복을 제거한 고유 앱 개수 산출
      const uniqueSalesApps = new Set(rawStore.sales.rows.map(r => r[3]).filter(Boolean));
      document.getElementById('kpiTrackedCount').textContent = uniqueSalesApps.size.toLocaleString() + '개';

      const uniqueFreeApps = new Set(rawStore.popular.rows.map(r => r[3]).filter(Boolean));
      document.getElementById('kpiNewReleaseCount').textContent = uniqueFreeApps.size.toLocaleString() + '개';
    }

    function renderChart(filterQuery = '') {
      const ctx = document.getElementById('rankChart').getContext('2d');
      const rows = rawStore.sales.rows;

      // X축 데이터: 날짜 (인덱스 0) 중복 제거 후 오름차순 정렬
      const dates = [...new Set(rows.map(r => r[0]).filter(Boolean))].sort();
      
      let targetApps = [];
      if (filterQuery) {
        targetApps = filterQuery.split(',').map(s => s.trim()).filter(Boolean);
      } else {
        // 검색어가 없으면 최신 날짜 기준 Top 5 자동 추출
        const latestDate = dates[dates.length - 1];
        targetApps = rows
          .filter(r => r[0] === latestDate)
          .sort((a, b) => Number(a[1]) - Number(b[1]))
          .slice(0, 5)
          .map(r => r[3]);
      }

      const colors = ['#818cf8', '#34d399', '#fbbf24', '#f87171', '#a78bfa', '#2dd4bf', '#fb923c'];
      const datasets = targetApps.map((appName, idx) => {
        const data = dates.map(date => {
          const record = rows.find(r => r[0] === date && r[3] === appName);
          return record ? Number(record[1]) : null;
        });
        
        return {
          label: appName,
          data: data,
          borderColor: colors[idx % colors.length],
          backgroundColor: 'transparent',
          tension: 0.3,
          borderWidth: 2,
          spanGaps: true
        };
      });

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: dates, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#94a3b8', font: { size: 11 } } },
            tooltip: { mode: 'index', intersect: false }
          },
          scales: {
            x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
            y: {
              reverse: true,
              min: 1,
              suggestedMax: 20,
              grid: { color: '#334155' },
              ticks: { color: '#94a3b8', stepSize: 10 }
            }
          }
        }
      });
    }

    function updateChartFilter() {
      const query = document.getElementById('chartFilterInput').value;
      renderChart(query);
    }

    function switchTab(tabKey) {
      currentTab = tabKey;
      ['sales', 'popular', 'newReleases'].forEach(key => {
        const btn = document.getElementById(`tabBtn-${key}`);
        if (key === tabKey) {
          btn.className = "pb-3 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400";
        } else {
          btn.className = "pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200";
        }
      });
      document.getElementById('tableSearch').value = '';
      renderTable();
    }

    function renderTable() {
      const data = rawStore[currentTab];
      const thead = document.getElementById('tableHead');
      const countEl = document.getElementById('tableRowCount');

      if (!data || !data.rows) return;

      thead.innerHTML = `<tr>${data.cols.map(c => `<th class="px-4 py-2.5 font-medium whitespace-nowrap">${c || '-'}</th>`).join('')}</tr>`;
      renderRows(data.rows);
      countEl.textContent = `총 ${data.rows.length.toLocaleString()}개 행`;
    }

    function renderRows(rows) {
      const tbody = document.getElementById('tableBody');
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="100%" class="px-4 py-8 text-center text-slate-500">데이터가 없습니다.</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map(row => `
        <tr class="hover:bg-slate-800/40 transition-colors">
          ${row.map(cell => `<td class="px-4 py-2.5 whitespace-nowrap">${cell !== '' && cell !== null ? cell : '-'}</td>`).join('')}
        </tr>
      `).join('');
    }

    function filterCurrentTable() {
      const query = document.getElementById('tableSearch').value.toLowerCase();
      const allRows = rawStore[currentTab].rows;
      const filtered = allRows.filter(row => row.some(cell => String(cell).toLowerCase().includes(query)));
      renderRows(filtered);
      document.getElementById('tableRowCount').textContent = `검색 결과: ${filtered.length.toLocaleString()}개 행`;
    }

    window.addEventListener('DOMContentLoaded', fetchAllData);
  </script>
</body>
</html>
